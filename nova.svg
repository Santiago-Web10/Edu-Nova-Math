<svg width="160" height="205" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 205" role="img" aria-label="Nova, tu guía robot espacial">
  <title>Nova</title>
  <defs>
    <linearGradient id="nvB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f80f2" /><stop offset=".55" stop-color="#5d52d3" /><stop offset="1" stop-color="#3b34a3" />
    </linearGradient>
    <linearGradient id="nvS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2058" /><stop offset="1" stop-color="#090a28" />
    </linearGradient>
    <linearGradient id="nvC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b7a" /><stop offset="1" stop-color="#a58bff" />
    </linearGradient>
    <linearGradient id="nvF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a0" /><stop offset=".5" stop-color="#ff9f1c" /><stop offset="1" stop-color="#ff4d6d00" />
    </linearGradient>
    <radialGradient id="nvE" cx=".4" cy=".35">
      <stop offset="0" stop-color="#3f8cff" /><stop offset=".6" stop-color="#1b46b8" /><stop offset="1" stop-color="#0b1a5c" />
    </radialGradient>
    <!-- Cuerpo reutilizable: extremidades, pies y ojos -->
    <rect id="nvLimb" width="18" height="38" rx="9" y="120" fill="url(#nvB)" stroke="#2c2780" stroke-width="2" />
    <rect id="nvFoot" width="22" height="20" y="160" rx="9" fill="#453ebb" stroke="#2c2780" stroke-width="2" />
    <circle id="nvEar" cy="78" r="10" fill="#4cc9f0" stroke="#2c2780" stroke-width="3" />
    <ellipse id="nvCheek" cy="92" rx="6" ry="4" fill="#ff6b7a" opacity=".65" />
    <g id="nvEye">
      <ellipse cy="76" rx="11" ry="14" fill="#fff" />
      <ellipse cy="77" rx="8" ry="10.5" fill="url(#nvE)" />
      <ellipse cy="78" rx="4.6" ry="6.4" fill="#04051a" />
      <circle cx="-3" cy="72" r="3.2" fill="#fff" />
      <circle cx="3" cy="82" r="1.6" fill="#fff" opacity=".85" />
    </g>
  </defs>

  <style>
    .nv-eye, .nv-glow { transform-box: fill-box; transform-origin: center; }
    .nv-eye { animation: blink 5s infinite; }
    .nv-glow { animation: glow 2.4s ease-in-out infinite; }
    .nv-arm { transform-box: fill-box; transform-origin: 30% 8%; animation: wave 2.6s ease-in-out infinite; }
    .nv-flame { transform-box: fill-box; transform-origin: top; animation: flick .5s ease-in-out infinite alternate; }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
    @keyframes glow { 50% { opacity: .55; transform: scale(1.18); } }
    @keyframes wave { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-32deg); } }
    @keyframes flick { to { transform: scaleY(1.3); opacity: .75; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    /* Accesorios: se eligen con el fragmento de la URL (assets/nova.svg#gorra) */
    .acc { display: none; }
    #capa:target ~ .acc-capa, #gafas:target ~ .acc-gafas,
    #gorra:target ~ .acc-gorra, #corona:target ~ .acc-corona { display: inline; }
  </style>

  <!-- Anclas para :target -->
  <g id="capa" /><g id="gafas" /><g id="gorra" /><g id="corona" />

  <path class="acc acc-capa" d="M42 116 Q80 206 118 116 L128 176 Q80 196 32 176Z" fill="url(#nvC)" />
  <path class="nv-flame" d="M62 176 Q68 204 74 176Z M86 176 Q92 204 98 176Z" fill="url(#nvF)" />
  <use href="#nvFoot" x="54" /><use href="#nvFoot" x="84" />
  <use href="#nvLimb" x="26" />
  <g class="nv-arm"><use href="#nvLimb" x="116" /><circle cx="125" cy="158" r="8" fill="#ffc83d" /></g>
  <rect x="44" y="112" width="72" height="58" rx="26" fill="url(#nvB)" stroke="#2c2780" stroke-width="2" />
  <rect x="60" y="124" width="40" height="30" rx="12" fill="#0f1038" stroke="#4cc9f0" stroke-width="1.5" />
  <path class="nv-glow" d="M80 128l3.4 7.2 7.8 1-5.7 5.4 1.5 7.8-7-3.8-7 3.8 1.5-7.8-5.7-5.4 7.8-1z" fill="#ffc83d" />
  <line x1="80" y1="36" x2="80" y2="16" stroke="#3b34a3" stroke-width="5" stroke-linecap="round" />
  <circle class="nv-glow" cx="80" cy="12" r="9" fill="#ff6b7a" />
  <circle cx="77" cy="9" r="3" fill="#fff" opacity=".8" />
  <use href="#nvEar" x="20" /><use href="#nvEar" x="140" />
  <rect x="24" y="34" width="112" height="86" rx="40" fill="url(#nvB)" stroke="#2c2780" stroke-width="2.5" />
  <ellipse cx="52" cy="46" rx="16" ry="6" fill="#fff" opacity=".35" transform="rotate(-20 52 46)" />
  <rect x="36" y="46" width="88" height="62" rx="28" fill="url(#nvS)" stroke="#4cc9f0" stroke-width="2" />
  <use class="nv-eye" href="#nvEye" x="62" /><use class="nv-eye" href="#nvEye" x="98" />
  <path d="M70 94 Q80 104 90 94" stroke="#4cc9f0" stroke-width="4.5" fill="none" stroke-linecap="round" />
  <use href="#nvCheek" x="48" /><use href="#nvCheek" x="112" />

  <g class="acc acc-gafas" fill="#ffc83d44" stroke="#ffc83d" stroke-width="4">
    <rect x="50" y="58" width="26" height="30" rx="11" /><rect x="84" y="58" width="26" height="30" rx="11" /><path d="M76 72h8" />
  </g>
  <g class="acc acc-gorra">
    <path d="M28 52 Q80 -10 132 52Z" fill="#ff9ec0" />
    <rect x="104" y="46" width="40" height="9" rx="4.5" fill="#ff7aa8" />
    <circle cx="80" cy="14" r="5" fill="#ffc83d" />
  </g>
  <g class="acc acc-corona">
    <path d="M50 38 L54 10 L68 26 L80 6 L92 26 L106 10 L110 38Z" fill="#ffc83d" stroke="#d99a00" stroke-width="3" stroke-linejoin="round" />
    <circle cx="80" cy="22" r="4" fill="#ff6b7a" />
  </g>
</svg>
